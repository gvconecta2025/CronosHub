<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <title>Chronos Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { darkBg: '#050505', darkSurface: '#121212', gold: '#D4AF37', textMuted: '#888888' },
                    backgroundImage: {
                        'gold-metallic': 'linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #AA7C11 100%)',
                        'glass-dark': 'linear-gradient(180deg, rgba(30,30,30,0.8) 0%, rgba(15,15,15,0.9) 100%)',
                        'button-dark': 'linear-gradient(180deg, #2a2a2a 0%, #151515 100%)'
                    }
                }
            }
        }
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; overscroll-behavior-y: contain; background-color: #050505; }
        
        .tab-anim { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        @media (max-width: 1023px) {
            ::-webkit-scrollbar { display: none; }
            .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        }
        
        @media (min-width: 1024px) {
            ::-webkit-scrollbar { width: 4px; height: 4px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; transition: background 0.3s; }
            ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
            body { background: radial-gradient(circle at top, #1a1a1a 0%, #050505 100%); background-attachment: fixed; }
            .drum-overlay { background: linear-gradient(to bottom, #121212 0%, transparent 35%, transparent 65%, #121212 100%); }
        }
        
        /* Ajuste Perfeito de Nitidez para Pickers */
        .picker-container { scroll-snap-type: y mandatory; }
        .picker-item { scroll-snap-align: center; scroll-snap-stop: always; height: 48px; font-size: 1.5rem; transition: all 0.2s ease; }
        .drum-overlay { background: linear-gradient(to bottom, #050505 0%, transparent 35%, transparent 65%, #050505 100%); pointer-events: none; }
        
        .progress-ring__circle { transition: stroke-dashoffset 1s linear; transform: rotate(-90deg); transform-origin: 50% 50%; }
        .neon-glow { filter: drop-shadow(0 0 16px rgba(212, 175, 55, 0.5)); }
        
        /* Widget Hover (Dark Glass) */
        .widget-card { background: rgba(25, 25, 25, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .widget-card:hover { transform: translateY(-4px); border-color: rgba(212, 175, 55, 0.3); box-shadow: 0 15px 40px rgba(212, 175, 55, 0.1); background: rgba(30, 30, 30, 0.6); }

        /* Calendário e Heatmap */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        .heatmap-dot { width: 4px; height: 4px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }

        /* Input Premium */
        .input-premium { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); transition: all 0.3s ease; }
        .input-premium:focus { border-color: #D4AF37; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), 0 0 15px rgba(212,175,55,0.1); outline: none; }
        
        /* Custom Native Date Input Overlay */
        input[type="date"]::-webkit-calendar-picker-indicator { width: 100%; height: 100%; margin: 0; padding: 0; cursor: pointer; opacity: 0; }
    </style>
</head>
<body class="text-white h-screen w-full flex flex-col overflow-hidden font-sans" onclick="App.System.initInteraction()">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 bg-[#050505] z-[100] flex flex-col items-center justify-center transition-opacity duration-700 ease-out">
        <img src="icon.svg" alt="Chronos Loading" class="w-32 h-32 lg:w-40 lg:h-40 mb-8 animate-pulse drop-shadow-[0_0_30px_rgba(212,175,55,0.3)]">
        <h1 class="text-3xl font-bold tracking-[0.3em] text-gold animate-pulse">CHRONOS<span class="text-white font-light">HUB</span></h1>
    </div>

    <!-- HEADER GLOBAL -->
    <header class="w-full py-5 px-8 flex justify-between items-center bg-black/40 backdrop-blur-xl border-b border-white/5 z-20">
        <h1 class="text-2xl font-bold tracking-[0.2em] text-transparent bg-clip-text bg-gold-metallic cursor-pointer" onclick="App.Router.closeDesktop(null, true)">CHRONOS<span class="text-white font-light">HUB</span></h1>
        <button onclick="App.Settings.openModal()" class="text-gray-400 hover:text-gold transition-colors p-2 active:scale-95">
            <i class="fa-solid fa-sliders text-xl"></i>
        </button>
    </header>

    <!-- ========================================== -->
    <!-- DASHBOARD DESKTOP (8 WIDGETS PREMIUM) -->
    <!-- ========================================== -->
    <div class="hidden lg:grid lg:grid-cols-4 gap-6 p-10 h-full w-full content-start max-w-[1500px] mx-auto" id="desktop-dashboard">
        
        <div onclick="App.Router.go('calendario')" class="widget-card rounded-[2rem] p-8 cursor-pointer flex flex-col justify-between h-44 group">
            <div class="flex justify-between items-start text-textMuted group-hover:text-gold transition-colors"><i class="fa-solid fa-calendar-days text-2xl"></i><span class="text-[10px] uppercase tracking-[0.2em] font-bold">Calendário</span></div>
            <div class="flex items-baseline gap-2 text-white">
                <span class="text-5xl font-extralight tabular-nums text-transparent bg-clip-text bg-gold-metallic drop-shadow-md" id="widget-calendar-day">--</span>
                <span class="text-sm font-bold uppercase tracking-widest text-gray-500 group-hover:text-white transition-colors" id="widget-calendar-month">---</span>
            </div>
        </div>

        <div onclick="App.Router.go('lembretes')" class="widget-card rounded-[2rem] p-8 cursor-pointer flex flex-col justify-between h-44 group relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-500/10 rounded-full blur-xl group-hover:bg-blue-500/20 transition-all"></div>
            <div class="flex justify-between items-start text-textMuted group-hover:text-blue-400 transition-colors"><i class="fa-solid fa-note-sticky text-2xl relative z-10"></i><span class="text-[10px] uppercase tracking-[0.2em] font-bold relative z-10">Lembretes</span></div>
            <div class="text-2xl font-light text-white relative z-10" id="widget-reminders-status">0 p/ hoje</div>
        </div>

        <div onclick="App.Router.go('alarme')" class="widget-card rounded-[2rem] p-8 cursor-pointer flex flex-col justify-between h-44 group">
            <div class="flex justify-between items-start text-textMuted group-hover:text-gold transition-colors"><i class="fa-solid fa-bell text-2xl"></i><span class="text-[10px] uppercase tracking-[0.2em] font-bold">Despertador</span></div>
            <div class="text-3xl font-light text-white" id="widget-alarm-status">Ativo</div>
        </div>

        <div onclick="App.Router.go('timer')" class="widget-card rounded-[2rem] p-8 cursor-pointer flex flex-col justify-between h-44 group">
            <div class="flex justify-between items-start text-textMuted group-hover:text-gold transition-colors"><i class="fa-solid fa-hourglass-half text-2xl"></i><span class="text-[10px] uppercase tracking-[0.2em] font-bold">Temporizador</span></div>
            <div class="text-4xl font-extralight tabular-nums tracking-wider text-transparent bg-clip-text bg-gold-metallic drop-shadow-md" id="widget-timer-time">00:00:00</div>
        </div>

        <div onclick="App.Router.go('cronometro')" class="widget-card rounded-[2rem] p-8 cursor-pointer flex flex-col justify-between h-44 group">
            <div class="flex justify-between items-start text-textMuted group-hover:text-gold transition-colors"><i class="fa-solid fa-stopwatch text-2xl"></i><span class="text-[10px] uppercase tracking-[0.2em] font-bold">Cronômetro</span></div>
            <div class="text-4xl font-extralight tabular-nums tracking-wider text-white" id="widget-stopwatch-time">00:00,00</div>
        </div>

        <div onclick="App.Router.go('calculadora')" class="widget-card rounded-[2rem] p-8 cursor-pointer flex flex-col justify-between h-44 group">
            <div class="flex justify-between items-start text-textMuted group-hover:text-gold transition-colors"><i class="fa-solid fa-calculator text-2xl"></i><span class="text-[10px] uppercase tracking-[0.2em] font-bold">Calculadora</span></div>
            <div class="text-4xl font-light truncate text-right w-full text-white" id="widget-calc-status">0</div>
        </div>

        <div onclick="App.Router.go('tarefas')" class="widget-card rounded-[2rem] p-8 cursor-pointer flex flex-col justify-between h-44 group">
            <div class="flex justify-between items-start text-textMuted group-hover:text-gold transition-colors"><i class="fa-solid fa-calendar-check text-2xl"></i><span class="text-[10px] uppercase tracking-[0.2em] font-bold">Tarefas</span></div>
            <div class="text-2xl font-light text-white" id="widget-tasks-status">0 pendentes</div>
        </div>

        <div onclick="App.Router.go('habitos')" class="widget-card rounded-[2rem] p-8 cursor-pointer flex flex-col justify-between h-44 group">
            <div class="flex justify-between items-start text-textMuted group-hover:text-gold transition-colors"><i class="fa-solid fa-fire text-2xl"></i><span class="text-[10px] uppercase tracking-[0.2em] font-bold">Hábitos</span></div>
            <div class="text-2xl font-light text-white" id="widget-habits-status">Monitorar</div>
        </div>

    </div>
